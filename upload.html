<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>健康证 · 快速提交</title>
    <!-- 样式和之前一样，略去，保持简洁，直接给完整代码 -->
    <style>
        /* ... 与之前相同，略 ... */
    </style>
</head>
<body>
<div class="container">
    <h1>📋 健康证 · 快速提交</h1>
    <div class="sub">填写完整信息，自动创建 Issue</div>

    <!-- 设置卡片 -->
    <div class="card" id="settingsCard">
        <div class="settings-note">⚙️ 首次使用请填写以下信息（仅保存在本机）</div>
        <label>📂 仓库路径</label>
        <input type="text" id="repoInput" placeholder="例如：merryAndrew/HealthCertificate">
        <label>🔑 GitHub Token</label>
        <input type="password" id="tokenInput" placeholder="需勾选 repo 权限">
        <label>🖼️ Imgbb API Key</label>
        <input type="password" id="imgbbKeyInput" placeholder="获取：api.imgbb.com">
        <div class="hint"><a href="https://api.imgbb.com/" target="_blank">点此获取免费 Imgbb API Key</a></div>
        <button class="btn btn-secondary" id="saveSettingsBtn">💾 保存设置</button>
        <div id="settingsStatus" style="margin-top:8px;font-size:13px;color:#64748b;"></div>
    </div>

    <!-- 主表单 -->
    <div class="card" id="formCard">
        <label>👤 姓名 *</label>
        <input type="text" id="nameInput" placeholder="例如：张三" required>

        <label>⚥ 性别 *</label>
        <select id="genderInput">
            <option value="男">男</option>
            <option value="女">女</option>
        </select>

        <label>🆔 身份证号 *</label>
        <input type="text" id="idNumberInput" placeholder="例如：441234199001011234" required>

        <label>📅 体检日期 *</label>
        <input type="date" id="dateInput" required>

        <label>📸 头像</label>
        <div class="file-upload-wrapper">
            <input type="file" id="avatarFile" accept="image/*">
            <button class="btn btn-success" id="uploadAvatarBtn" style="flex:0 0 auto; padding:10px 20px; font-size:14px; width:auto;">上传并获取链接</button>
        </div>
        <div id="uploadStatus" class="upload-progress"></div>
        <img id="avatarPreview" class="avatar-preview" alt="头像预览">
        <input type="url" id="avatarInput" placeholder="或手动粘贴图片链接" style="margin-top:10px;">

        <label>📝 备注（可选）</label>
        <textarea id="noteInput" placeholder="其他补充信息"></textarea>

        <button class="btn" id="submitBtn">🚀 提交 Issue</button>

        <!-- 加载动画 -->
        <div class="loader-container" id="loaderContainer">
            <div class="spinner"></div>
            <div class="loader-text">⏳ 正在生成健康证明...</div>
            <div class="loader-sub" id="pollStatus">正在等待部署完成，请稍候...</div>
        </div>

        <!-- 查看结果 -->
        <div class="view-result-area" id="viewResultArea">
            <button class="btn btn-view" id="viewResultBtn">✅ 查看我的健康证</button>
            <div style="text-align:center;font-size:12px;color:#94a3b8;margin-top:8px;">点击后将跳转到 A 版卡片</div>
        </div>

        <div id="statusMessage" class="status"></div>
    </div>

    <div class="footer">数据保存在 <strong>GitHub Issues</strong> · 仅供本人使用</div>
</div>

<script>
    (function() {
        const REPO_KEY = 'github_issue_upload_repo';
        const TOKEN_KEY = 'github_issue_upload_token';
        const IMGBB_KEY = 'github_issue_upload_imgbb';

        const repoInput = document.getElementById('repoInput');
        const tokenInput = document.getElementById('tokenInput');
        const imgbbKeyInput = document.getElementById('imgbbKeyInput');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const settingsStatus = document.getElementById('settingsStatus');
        const nameInput = document.getElementById('nameInput');
        const genderInput = document.getElementById('genderInput');
        const idNumberInput = document.getElementById('idNumberInput');
        const dateInput = document.getElementById('dateInput');
        const avatarFile = document.getElementById('avatarFile');
        const uploadAvatarBtn = document.getElementById('uploadAvatarBtn');
        const uploadStatus = document.getElementById('uploadStatus');
        const avatarPreview = document.getElementById('avatarPreview');
        const avatarInput = document.getElementById('avatarInput');
        const noteInput = document.getElementById('noteInput');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('statusMessage');
        const loaderContainer = document.getElementById('loaderContainer');
        const viewResultArea = document.getElementById('viewResultArea');
        const viewResultBtn = document.getElementById('viewResultBtn');
        const pollStatus = document.getElementById('pollStatus');

        // 设置日期默认今天
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;

        let lastIssueTitle = '';
        let pollTimer = null;
        let pollCount = 0;
        const MAX_POLLS = 24;

        function loadSettings() {
            const repo = localStorage.getItem(REPO_KEY) || '';
            const token = localStorage.getItem(TOKEN_KEY) || '';
            const imgbb = localStorage.getItem(IMGBB_KEY) || '';
            repoInput.value = repo;
            tokenInput.value = token;
            imgbbKeyInput.value = imgbb;
            updateSettingsStatus();
        }
        function updateSettingsStatus() {
            const repo = localStorage.getItem(REPO_KEY);
            const token = localStorage.getItem(TOKEN_KEY);
            const imgbb = localStorage.getItem(IMGBB_KEY);
            if (repo && token && imgbb) {
                settingsStatus.textContent = '✅ 所有设置已保存，可直接使用';
                settingsStatus.style.color = '#166534';
            } else {
                settingsStatus.textContent = '⚠️ 请完整填写并保存仓库路径、Token 和 Imgbb Key';
                settingsStatus.style.color = '#b45309';
            }
        }
        saveSettingsBtn.addEventListener('click', function() {
            const repo = repoInput.value.trim();
            const token = tokenInput.value.trim();
            const imgbb = imgbbKeyInput.value.trim();
            if (!repo || !token || !imgbb) {
                settingsStatus.textContent = '❌ 请完整填写仓库路径、Token 和 Imgbb Key';
                settingsStatus.style.color = '#991b1b';
                return;
            }
            localStorage.setItem(REPO_KEY, repo);
            localStorage.setItem(TOKEN_KEY, token);
            localStorage.setItem(IMGBB_KEY, imgbb);
            settingsStatus.textContent = '✅ 设置已保存！';
            settingsStatus.style.color = '#166534';
            updateSettingsStatus();
        });

        // 上传头像
        uploadAvatarBtn.addEventListener('click', async function() {
            const file = avatarFile.files[0];
            if (!file) {
                uploadStatus.textContent = '⚠️ 请先选择一张图片';
                uploadStatus.style.color = '#b45309';
                return;
            }
            const imgbbKey = localStorage.getItem(IMGBB_KEY);
            if (!imgbbKey) {
                uploadStatus.textContent = '⚠️ 请先保存 Imgbb API Key';
                uploadStatus.style.color = '#b45309';
                return;
            }
            uploadStatus.textContent = '⏳ 上传中...';
            uploadStatus.style.color = '#2563eb';
            const formData = new FormData();
            formData.append('key', imgbbKey);
            formData.append('image', file);
            try {
                const response = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData });
                const data = await response.json();
                if (data.success) {
                    const url = data.data.url;
                    avatarInput.value = url;
                    avatarPreview.src = url;
                    avatarPreview.style.display = 'block';
                    uploadStatus.textContent = '✅ 上传成功！链接已自动填入';
                    uploadStatus.style.color = '#166534';
                } else {
                    throw new Error(data.error?.message || '上传失败');
                }
            } catch (err) {
                uploadStatus.textContent = '❌ 上传失败：' + err.message;
                uploadStatus.style.color = '#991b1b';
            }
        });
        avatarInput.addEventListener('input', function() {
            const url = this.value.trim();
            if (url) {
                avatarPreview.src = url;
                avatarPreview.style.display = 'block';
            } else {
                avatarPreview.style.display = 'none';
            }
        });

        // 创建 Issue
        async function createIssue(repo, token, title, body) {
            const url = `https://api.github.com/repos/${repo}/issues`;
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ title, body })
            });
            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(`GitHub API 错误 (${response.status}): ${errData.message || response.statusText}`);
            }
            return response.json();
        }

        // 轮询检测
        function startPolling(title) {
            pollCount = 0;
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(async function() {
                pollCount++;
                pollStatus.textContent = `⏳ 正在等待部署完成... (${pollCount * 5}秒)`;
                try {
                    const url = `https://merryAndrew.github.io/HealthCertificate/card.html?t=${Date.now()}`;
                    const resp = await fetch(url);
                    if (!resp.ok) return;
                    const html = await resp.text();
                    const searchStr = `data-title="${title}"`;
                    if (html.includes(searchStr)) {
                        clearInterval(pollTimer);
                        pollTimer = null;
                        loaderContainer.classList.remove('active');
                        viewResultArea.classList.add('active');
                        submitBtn.disabled = false;
                        statusDiv.textContent = `✅ 健康证已生成！`;
                        statusDiv.className = 'status success';
                        statusDiv.style.display = 'block';
                        // 清空表单，保留日期默认今天
                        nameInput.value = '';
                        genderInput.value = '男';
                        idNumberInput.value = '';
                        dateInput.value = today;
                        avatarInput.value = '';
                        avatarPreview.style.display = 'none';
                        avatarFile.value = '';
                        noteInput.value = '';
                    }
                } catch (e) {}
                if (pollCount >= MAX_POLLS) {
                    clearInterval(pollTimer);
                    pollTimer = null;
                    loaderContainer.classList.remove('active');
                    submitBtn.disabled = false;
                    statusDiv.textContent = '⚠️ 检测超时，可能部署较慢。请稍后手动刷新页面或点击下方按钮尝试查看。';
                    statusDiv.className = 'status error';
                    statusDiv.style.display = 'block';
                    viewResultArea.classList.add('active');
                }
            }, 5000);
        }

        // 提交事件
        submitBtn.addEventListener('click', async function() {
            statusDiv.className = 'status';
            statusDiv.style.display = 'none';
            loaderContainer.classList.remove('active');
            viewResultArea.classList.remove('active');
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
            submitBtn.disabled = true;

            const repo = localStorage.getItem(REPO_KEY);
            const token = localStorage.getItem(TOKEN_KEY);
            if (!repo || !token) {
                statusDiv.textContent = '⚠️ 请先在设置中保存仓库路径和 Token';
                statusDiv.className = 'status error';
                statusDiv.style.display = 'block';
                submitBtn.disabled = false;
                return;
            }

            const name = nameInput.value.trim();
            const gender = genderInput.value;
            const idNumber = idNumberInput.value.trim();
            let date = dateInput.value;
            if (!date) date = today; // 如果未选，用今天
            const avatar = avatarInput.value.trim() || '（无头像）';
            const note = noteInput.value.trim() || '';

            if (!name || !idNumber) {
                statusDiv.textContent = '⚠️ 请完整填写姓名和身份证号';
                statusDiv.className = 'status error';
                statusDiv.style.display = 'block';
                submitBtn.disabled = false;
                return;
            }

            // 标题只用姓名
            const title = `${name}`;
            // 正文使用中文冒号，确保正则匹配
            let body = `## 📋 健康证信息\n\n`;
            body += `- **姓名**：${name}\n`;
            body += `- **性别**：${gender}\n`;
            body += `- **身份证**：${idNumber}\n`;
            body += `- **体检日期**：${date}\n`;
            if (avatar !== '（无头像）') {
                body += `- **头像**：![头像](${avatar})\n`;
            }
            if (note) {
                body += `\n## 📝 备注\n${note}\n`;
            }
            body += `\n---\n*提交于 ${new Date().toLocaleString('zh-CN')}*`;

            statusDiv.textContent = '⏳ 正在提交 Issue...';
            statusDiv.className = 'status loading';
            statusDiv.style.display = 'block';

            try {
                const result = await createIssue(repo, token, title, body);
                lastIssueTitle = encodeURIComponent(title);
                statusDiv.style.display = 'none';
                loaderContainer.classList.add('active');
                pollStatus.textContent = '⏳ 正在等待部署完成... (0秒)';
                submitBtn.disabled = true;
                startPolling(title);
            } catch (err) {
                statusDiv.textContent = `❌ 提交失败：${err.message}`;
                statusDiv.className = 'status error';
                statusDiv.style.display = 'block';
                submitBtn.disabled = false;
                loaderContainer.classList.remove('active');
            }
        });

        // 查看结果
        viewResultBtn.addEventListener('click', function() {
            if (!lastIssueTitle) {
                alert('没有可查看的结果，请先提交 Issue');
                return;
            }
            const url = `https://merryAndrew.github.io/HealthCertificate/card.html?id=${lastIssueTitle}`;
            window.open(url, '_blank');
        });

        loadSettings();
        if (!localStorage.getItem(REPO_KEY)) repoInput.focus();
    })();
</script>
</body>
</html>
