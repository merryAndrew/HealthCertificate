<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>健康证 · 快速提交</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #f2f4f8;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Roboto, Arial, sans-serif;
            padding: 16px;
            color: #1a2332;
        }
        .app {
            max-width: 480px;
            margin: 0 auto;
        }
        .header {
            padding: 8px 0 4px;
            text-align: center; /* 新增居中 */
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #0a1628;
            letter-spacing: -0.3px;
        }
        .header p {
            font-size: 14px;
            color: #6b7a8f;
            margin-top: 2px;
        }

        .section {
            background: #ffffff;
            border-radius: 16px;
            padding: 18px 16px 20px;
            margin-top: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #0a1628;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f2f5;
        }
        .section-title .badge {
            font-size: 11px;
            font-weight: 400;
            color: #6b7a8f;
            margin-left: 8px;
        }

        .field {
            margin-bottom: 14px;
        }
        .field:last-child {
            margin-bottom: 0;
        }
        .field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #1a2332;
            margin-bottom: 4px;
        }
        .field label .required {
            color: #e53e3e;
            margin-left: 2px;
        }
        .field input,
        .field select,
        .field textarea {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #dce0e6;
            border-radius: 10px;
            background: #f8fafc;
            transition: border 0.2s, box-shadow 0.2s;
            outline: none;
            color: #1a2332;
            font-family: inherit;
        }
        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: #2b6ef0;
            box-shadow: 0 0 0 3px rgba(43, 110, 240, 0.12);
            background: #ffffff;
        }
        .field textarea {
            min-height: 64px;
            resize: vertical;
        }
        .field .hint {
            font-size: 12px;
            color: #8a9aa8;
            margin-top: 4px;
        }
        .field .hint a {
            color: #2b6ef0;
            text-decoration: none;
        }

        .avatar-zone {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            background: #f8fafc;
            border: 1px dashed #d0d6de;
            border-radius: 12px;
            padding: 14px 16px;
            transition: border-color 0.2s;
        }
        .avatar-zone:focus-within {
            border-color: #2b6ef0;
        }
        .avatar-zone .file-input {
            flex: 1;
            min-width: 120px;
        }
        .avatar-zone .file-input input[type="file"] {
            width: 100%;
            padding: 6px 0;
            font-size: 13px;
            border: none;
            background: transparent;
        }
        .avatar-zone .upload-btn {
            flex-shrink: 0;
            padding: 8px 20px;
            font-size: 14px;
            font-weight: 500;
            background: #eef2f7;
            color: #1a2332;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .avatar-zone .upload-btn:active {
            background: #dce0e6;
        }
        .avatar-zone .upload-status {
            font-size: 12px;
            color: #2b6ef0;
            width: 100%;
            margin-top: 2px;
        }
        .avatar-preview-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .avatar-preview-wrap img {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e8ecf2;
            display: none;
        }
        .avatar-preview-wrap input[type="url"] {
            flex: 1;
            min-width: 140px;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #dce0e6;
            border-radius: 8px;
            background: #f8fafc;
            outline: none;
        }
        .avatar-preview-wrap input[type="url"]:focus {
            border-color: #2b6ef0;
            box-shadow: 0 0 0 3px rgba(43, 110, 240, 0.10);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            font-weight: 600;
            background: #1a2332;
            color: #ffffff;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 6px;
        }
        .btn-primary:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .btn-save {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            background: #eef2f7;
            color: #1a2332;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn-save:active {
            background: #dce0e6;
        }

        .btn-view {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            font-weight: 600;
            background: #2b6ef0;
            color: #ffffff;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-view:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        .status {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            text-align: center;
        }
        .status.success {
            display: block;
            color: #0d6832;
            background: transparent;
            border: none;
            padding: 10px 0;
        }
        .status.error {
            display: block;
            background: #fde8e8;
            color: #b33636;
            border: 1px solid #f7cece;
        }
        .status.loading {
            display: block;
            background: #e8f0fe;
            color: #1a5bb5;
            border: 1px solid #c5d9f5;
        }

        .settings-status {
            display: inline-block;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 20px;
            background: #e8ecf2;
            color: #4a5a6e;
            white-space: nowrap;
            cursor: default;
            user-select: none;
            transition: background 0.2s;
        }
        .settings-status.ok {
            background: #d4edda;
            color: #0d6832;
        }
        .settings-status.warn {
            background: #fff3cd;
            color: #856404;
        }

        .loader {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 16px 0 8px;
        }
        .loader.active {
            display: flex;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #e8ecf2;
            border-top: 3px solid #1a2332;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
        .loader-text {
            font-size: 15px;
            font-weight: 500;
            color: #1a2332;
        }
        .loader-sub {
            font-size: 13px;
            color: #6b7a8f;
            margin-top: 2px;
        }

        .view-area {
            display: none;
            margin-top: 12px;
        }
        .view-area.active {
            display: block;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #8a9aa8;
            margin-top: 20px;
            padding-bottom: 10px;
        }

        .settings-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .settings-grid .field {
            margin-bottom: 0;
        }
        .settings-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .settings-actions .spacer {
            flex: 1;
        }
    </style>
</head>
<body>
<div class="app">
    <!-- 头部居中 -->
    <div class="header">
        <h1>📋 健康证 · 快速提交</h1>
        <p>填写完整信息，自动创建 Issue</p>
    </div>

    <div class="section">
        <div class="section-title">⚙️ 系统配置 <span class="badge">仅保存在本机</span></div>
        <div class="settings-grid">
            <div class="field">
                <label>GitHub 仓库路径</label>
                <input type="text" id="repoInput" placeholder="例：merryAndrew/HealthCertificate">
            </div>
            <div class="field">
                <label>GitHub Token <span style="font-weight:400;color:#6b7a8f;">（需 repo 权限）</span></label>
                <input type="password" id="tokenInput" placeholder="输入您的 Token">
            </div>
            <div class="field">
                <label>Imgbb API Key</label>
                <input type="password" id="imgbbKeyInput" placeholder="获取：api.imgbb.com">
                <div class="hint"><a href="https://api.imgbb.com/" target="_blank">点此获取免费 Imgbb API Key</a></div>
            </div>
        </div>
        <div class="settings-actions">
            <button class="btn-save" id="saveSettingsBtn">保存设置</button>
            <button class="btn-save" id="clearSettingsBtn" style="display:none;">移除密钥</button>
            <span class="settings-status" id="settingsStatus">请填写完整信息</span>
        </div>
    </div>

    <div class="section">
        <div class="section-title">📝 基础信息</div>

        <div class="field">
            <label>姓名 <span class="required">*</span></label>
            <input type="text" id="nameInput" placeholder="请输入姓名">
        </div>

        <div class="field">
            <label>性别 <span class="required">*</span></label>
            <select id="genderInput">
                <option value="男">男</option>
                <option value="女">女</option>
            </select>
        </div>

        <div class="field">
            <label>身份证号 <span class="required">*</span></label>
            <input type="text" id="idNumberInput" placeholder="请输入身份证号码">
        </div>

        <div class="field">
            <label>体检日期 <span class="required">*</span></label>
            <input type="date" id="dateInput">
        </div>

        <div class="field">
            <label>头像照片</label>
            <div class="avatar-zone">
                <div class="file-input">
                    <input type="file" id="avatarFile" accept="image/*">
                </div>
                <button class="upload-btn" id="uploadAvatarBtn">上传并获取链接</button>
                <div class="upload-status" id="uploadStatus">支持 JPG / PNG 格式</div>
            </div>
            <div class="avatar-preview-wrap">
                <img id="avatarPreview" alt="头像预览">
                <input type="url" id="avatarInput" placeholder="或手动粘贴图片链接">
            </div>
        </div>

        <div class="field">
            <label>备注 <span style="font-weight:400;color:#6b7a8f;">（可选）</span></label>
            <textarea id="noteInput" placeholder="其他补充信息..."></textarea>
        </div>

        <button class="btn-primary" id="submitBtn">🚀 提交 Issue</button>

        <div class="loader" id="loaderContainer">
            <div class="spinner"></div>
            <div class="loader-text">⏳ 正在生成健康证明...</div>
            <div class="loader-sub" id="pollStatus">正在等待部署完成，请稍候...</div>
        </div>

        <div class="view-area" id="viewResultArea">
            <button class="btn-view" id="viewResultBtn">✅ 查看我的健康证</button>
        </div>

        <div class="status" id="statusMessage"></div>
    </div>

    <div class="footer-note">
        数据基于 GitHub Issues 自动化生成
    </div>
</div>

<script>
    (function() {
        const REPO_KEY = 'github_issue_upload_repo';
        const TOKEN_KEY = 'github_issue_upload_token';
        const IMGBB_KEY = 'github_issue_upload_imgbb';

        const repoInput = document.getElementById('repoInput');
        const tokenInput = document.getElementById('tokenInput');
        const imgbbKeyInput = document.getElementById('imgbbKeyInput');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const clearSettingsBtn = document.getElementById('clearSettingsBtn');
        const settingsStatus = document.getElementById('settingsStatus');
        const nameInput = document.getElementById('nameInput');
        const genderInput = document.getElementById('genderInput');
        const idNumberInput = document.getElementById('idNumberInput');
        const dateInput = document.getElementById('dateInput');
        const avatarFile = document.getElementById('avatarFile');
        const uploadAvatarBtn = document.getElementById('uploadAvatarBtn');
        const uploadStatus = document.getElementById('uploadStatus');
        const avatarPreview = document.getElementById('avatarPreview');
        const avatarInput = document.getElementById('avatarInput');
        const noteInput = document.getElementById('noteInput');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('statusMessage');
        const loaderContainer = document.getElementById('loaderContainer');
        const viewResultArea = document.getElementById('viewResultArea');
        const viewResultBtn = document.getElementById('viewResultBtn');
        const pollStatus = document.getElementById('pollStatus');

        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;

        let lastIssueTitle = '';
        let pollTimer = null;
        let pollCount = 0;
        const MAX_POLLS = 24;

        function hasStoredData() {
            return localStorage.getItem(REPO_KEY) || localStorage.getItem(TOKEN_KEY) || localStorage.getItem(IMGBB_KEY);
        }

        function updateClearButtonVisibility() {
            if (hasStoredData()) {
                clearSettingsBtn.style.display = 'inline-block';
            } else {
                clearSettingsBtn.style.display = 'none';
            }
        }

        function loadSettings() {
            const repo = localStorage.getItem(REPO_KEY) || '';
            const token = localStorage.getItem(TOKEN_KEY) || '';
            const imgbb = localStorage.getItem(IMGBB_KEY) || '';
            repoInput.value = repo;
            tokenInput.value = token;
            imgbbKeyInput.value = imgbb;
            updateSettingsStatus();
            updateClearButtonVisibility();
        }

        function updateSettingsStatus() {
            const repo = localStorage.getItem(REPO_KEY);
            const token = localStorage.getItem(TOKEN_KEY);
            const imgbb = localStorage.getItem(IMGBB_KEY);
            const el = settingsStatus;
            if (repo && token && imgbb) {
                el.textContent = '配置完成';
                el.className = 'settings-status ok';
            } else {
                el.textContent = '⚠️ 请完整填写并保存';
                el.className = 'settings-status warn';
            }
        }

        saveSettingsBtn.addEventListener('click', function() {
            const repo = repoInput.value.trim();
            const token = tokenInput.value.trim();
            const imgbb = imgbbKeyInput.value.trim();
            if (!repo || !token || !imgbb) {
                settingsStatus.textContent = '❌ 请完整填写所有配置项';
                settingsStatus.className = 'settings-status warn';
                return;
            }
            localStorage.setItem(REPO_KEY, repo);
            localStorage.setItem(TOKEN_KEY, token);
            localStorage.setItem(IMGBB_KEY, imgbb);
            settingsStatus.textContent = '✅ 配置已保存';
            settingsStatus.className = 'settings-status ok';
            updateSettingsStatus();
            updateClearButtonVisibility();
        });

        clearSettingsBtn.addEventListener('click', function() {
            localStorage.removeItem(REPO_KEY);
            localStorage.removeItem(TOKEN_KEY);
            localStorage.removeItem(IMGBB_KEY);
            repoInput.value = '';
            tokenInput.value = '';
            imgbbKeyInput.value = '';
            settingsStatus.textContent = '🗑️ 已清除所有配置';
            settingsStatus.className = 'settings-status warn';
            updateSettingsStatus();
            updateClearButtonVisibility();
        });

        uploadAvatarBtn.addEventListener('click', async function() {
            const file = avatarFile.files[0];
            if (!file) {
                uploadStatus.textContent = '⚠️ 请先选择一张图片';
                uploadStatus.style.color = '#b33636';
                return;
            }
            const imgbbKey = localStorage.getItem(IMGBB_KEY);
            if (!imgbbKey) {
                uploadStatus.textContent = '⚠️ 请先保存 Imgbb API Key';
                uploadStatus.style.color = '#b33636';
                return;
            }
            uploadStatus.textContent = '⏳ 上传中...';
            uploadStatus.style.color = '#2b6ef0';
            const formData = new FormData();
            formData.append('key', imgbbKey);
            formData.append('image', file);
            try {
                const response = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData });
                const data = await response.json();
                if (data.success) {
                    const url = data.data.url;
                    avatarInput.value = url;
                    avatarPreview.src = url;
                    avatarPreview.style.display = 'block';
                    uploadStatus.textContent = '✅ 上传成功！链接已自动填入';
                    uploadStatus.style.color = '#0d6832';
                } else {
                    throw new Error(data.error?.message || '上传失败');
                }
            } catch (err) {
                uploadStatus.textContent = '❌ ' + err.message;
                uploadStatus.style.color = '#b33636';
            }
        });

        avatarInput.addEventListener('input', function() {
            const url = this.value.trim();
            if (url) {
                avatarPreview.src = url;
                avatarPreview.style.display = 'block';
            } else {
                avatarPreview.style.display = 'none';
            }
        });

        async function createIssue(repo, token, title, body) {
            const url = `https://api.github.com/repos/${repo}/issues`;
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ title, body })
            });
            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(`GitHub API 错误 (${response.status}): ${errData.message || response.statusText}`);
            }
            return response.json();
        }

        function startPolling(title) {
            pollCount = 0;
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(async function() {
                pollCount++;
                pollStatus.textContent = `⏳ 正在等待部署完成... (${pollCount * 5}秒)`;
                try {
                    const url = `https://merryAndrew.github.io/HealthCertificate/card.html?t=${Date.now()}`;
                    const resp = await fetch(url);
                    if (!resp.ok) return;
                    const html = await resp.text();
                    const searchStr = `data-title="${title}"`;
                    if (html.includes(searchStr)) {
                        clearInterval(pollTimer);
                        pollTimer = null;
                        loaderContainer.classList.remove('active');
                        viewResultArea.classList.add('active');
                        submitBtn.disabled = false;
                        statusDiv.textContent = '✅ 健康证已生成！';
                        statusDiv.className = 'status success';
                        statusDiv.style.display = 'block';
                        nameInput.value = '';
                        genderInput.value = '男';
                        idNumberInput.value = '';
                        dateInput.value = today;
                        avatarInput.value = '';
                        avatarPreview.style.display = 'none';
                        avatarFile.value = '';
                        noteInput.value = '';
                    }
                } catch (e) {}
                if (pollCount >= MAX_POLLS) {
                    clearInterval(pollTimer);
                    pollTimer = null;
                    loaderContainer.classList.remove('active');
                    submitBtn.disabled = false;
                    statusDiv.textContent = '⚠️ 检测超时，可能部署较慢。请稍后手动刷新页面或点击下方按钮尝试查看。';
                    statusDiv.className = 'status error';
                    statusDiv.style.display = 'block';
                    viewResultArea.classList.add('active');
                }
            }, 5000);
        }

        submitBtn.addEventListener('click', async function() {
            statusDiv.className = 'status';
            statusDiv.style.display = 'none';
            loaderContainer.classList.remove('active');
            viewResultArea.classList.remove('active');
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
            submitBtn.disabled = true;

            const repo = localStorage.getItem(REPO_KEY);
            const token = localStorage.getItem(TOKEN_KEY);
            if (!repo || !token) {
                statusDiv.textContent = '⚠️ 请先在「系统配置」中保存仓库路径和 Token';
                statusDiv.className = 'status error';
                statusDiv.style.display = 'block';
                submitBtn.disabled = false;
                return;
            }

            const name = nameInput.value.trim();
            const gender = genderInput.value;
            const idNumber = idNumberInput.value.trim();
            let date = dateInput.value || today;
            const avatar = avatarInput.value.trim() || '';
            const note = noteInput.value.trim() || '';

            if (!name || !idNumber) {
                statusDiv.textContent = '⚠️ 请完整填写姓名和身份证号';
                statusDiv.className = 'status error';
                statusDiv.style.display = 'block';
                submitBtn.disabled = false;
                return;
            }

            const title = name;
            let body = `姓名：${name}\n`;
            body += `性别：${gender}\n`;
            body += `身份证：${idNumber}\n`;
            body += `体检日期：${date}\n`;
            if (avatar) body += `头像图片：${avatar}\n`;
            if (note) body += `备注：${note}\n`;
            body += `提交于：${new Date().toLocaleString('zh-CN')}`;

            statusDiv.textContent = '⏳ 正在提交 Issue...';
            statusDiv.className = 'status loading';
            statusDiv.style.display = 'block';

            try {
                const result = await createIssue(repo, token, title, body);
                lastIssueTitle = encodeURIComponent(title);
                statusDiv.style.display = 'none';
                loaderContainer.classList.add('active');
                pollStatus.textContent = '⏳ 正在等待部署完成... (0秒)';
                submitBtn.disabled = true;
                startPolling(title);
            } catch (err) {
                statusDiv.textContent = '❌ 提交失败：' + err.message;
                statusDiv.className = 'status error';
                statusDiv.style.display = 'block';
                submitBtn.disabled = false;
                loaderContainer.classList.remove('active');
            }
        });

        viewResultBtn.addEventListener('click', function() {
            if (!lastIssueTitle) {
                alert('没有可查看的结果，请先提交 Issue');
                return;
            }
            window.open(`https://merryAndrew.github.io/HealthCertificate/card.html?id=${lastIssueTitle}`, '_blank');
        });

        loadSettings();
    })();
</script>
</body>
</html>
