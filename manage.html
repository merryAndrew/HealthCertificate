<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康证 · 数据管理</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f2f4f8; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Roboto, Arial, sans-serif; padding: 20px; color: #1a2332; }
        .container { max-width: 1200px; margin: 0 auto; background: #fff; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 24px; border:1px solid #CCCCCC; }

        /* 头部：标题一行，按钮一行（返回左，刷新右） */
        .header-title { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 12px; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
        .header-actions .btn-left { flex-shrink: 0; }
        .header-actions .btn-right { flex-shrink: 0; }

        .btn { padding: 8px 18px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; background: #e1e4e8; color: #24292f; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
        .btn-primary { background: #1a2332; color: #fff; }
        .btn-primary:hover { background: #2d3a4f; }
        .btn-success { background: #1f883d; color: #fff; }
        .btn-success:hover { background: #1a7a34; }
        .btn-danger { background: #cf222e; color: #fff; }
        .btn-danger:hover { background: #b11f2b; }
        .btn-outline { background: transparent; border: 1px solid #d0d7de; }
        .btn-outline:hover { background: #f6f8fa; }
        .btn-info { background: #2b6ef0; color: #fff; }
        .btn-info:hover { background: #1a5bb5; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn-close-fail { background: #6b7a8f; color: #fff; padding: 6px 20px; border: none; border-radius: 20px; cursor: pointer; font-size: 14px; }
        .btn-close-fail:hover { background: #4a5a6e; }

        .search-bar { position: sticky; top: 0; z-index: 10; background: #fff; padding: 12px 0; margin-bottom: 16px; border-bottom: 2px solid #f0f2f5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .search-bar input { flex: 1; min-width: 200px; padding: 10px 14px; border: 1px solid #d0d7de; border-radius: 8px; font-size: 15px; outline: none; }
        .search-bar input:focus { border-color: #1a2332; box-shadow: 0 0 0 3px rgba(26,35,50,0.12); }
        .search-bar .badge { font-size: 13px; color: #6b7a8f; }

        .table-wrap { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 14px;
            border: 1.2px solid #CCCCCC;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 10px;
            border: 1px solid #CCCCCC;
            vertical-align: middle;
            text-align: center;
        }
        th { background: #f6f8fa; font-weight: 600; }
        tr:hover td { background: #fafbfc; }

        .avatar { width: 50px; height: 66px; border-radius: 7px; object-fit: cover; background: #e1e4e8; display: inline-block; }
        .name-cell { white-space: nowrap; }
        .no-data { text-align: center; padding: 40px 0; color: #8b949e; }
        .batch-bar { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding-top: 12px; border-top: 2px solid #f0f2f5; }

        .action-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .action-row { display: flex; gap: 4px; justify-content: center; }

        /* Toast 居中 */
        .toast-center { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 3000; justify-content: center; align-items: center; }
        .toast-center.active { display: flex; }
        .toast-center .toast-box { background: #fff; border-radius: 16px; padding: 30px 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; max-width: 400px; width: 90%; }
        .toast-center .toast-box .icon { font-size: 48px; margin-bottom: 12px; }
        .toast-center .toast-box .msg { font-size: 18px; font-weight: 500; color: #1a2332; }
        .toast-center .toast-box .sub { font-size: 14px; color: #6b7a8f; margin-top: 6px; }
        .toast-center .toast-box .btn-close-toast { margin-top: 20px; padding: 8px 32px; background: #1a2332; color: #fff; border: none; border-radius: 20px; cursor: pointer; font-size: 14px; }

        /* 加载动画居中 */
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
        .loading-overlay.active { display: flex; }
        .loading-overlay .spinner { width: 48px; height: 48px; border: 4px solid #e8ecf2; border-top: 4px solid #1a2332; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
        .loading-overlay .loading-text { font-size: 16px; color: #1a2332; font-weight: 500; }
        @keyframes spin { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }

        /* 通用模态框 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal-overlay.active { display: block; }
        .modal-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 16px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; padding: 28px 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .modal-box .close-btn { position: absolute; right: 16px; top: 16px; background: none; border: none; font-size: 24px; cursor: pointer; color: #8b949e; }
        .modal-box .close-btn:hover { color: #1a2332; }
        .modal-box h2 { margin-bottom: 20px; font-size: 20px; }
        .modal-box .field { margin-bottom: 14px; }
        .modal-box .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
        .modal-box .field input, .modal-box .field select { width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #dce0e6; border-radius: 10px; background: #f8fafc; outline: none; }
        .modal-box .field input:focus, .modal-box .field select:focus { border-color: #2b6ef0; box-shadow: 0 0 0 3px rgba(43,110,240,0.1); }
        .modal-progress { margin-top: 16px; height: 4px; background: #e8ecf2; border-radius: 2px; overflow: hidden; display: none; }
        .modal-progress.active { display: block; }
        .modal-progress .bar { height: 100%; width: 0%; background: #2b6ef0; border-radius: 2px; animation: progressAnim 1.8s ease-in-out infinite; }
        @keyframes progressAnim { 0% { width: 0%; } 50% { width: 70%; } 100% { width: 100%; } }
        .modal-status { display: none; text-align: center; font-size: 13px; color: #6b7a8f; margin-top: 8px; }
        .modal-status.active { display: block; }
        .modal-status.error { color: #cf222e; }
        .modal-status.success { color: #1f883d; }
        .modal-box .btn-submit-modal { width: 100%; padding: 14px; font-size: 17px; font-weight: 600; background: #1a2332; color: #fff; border: none; border-radius: 40px; cursor: pointer; margin-top: 10px; }
        .modal-box .btn-submit-modal:disabled { opacity: 0.5; }
        .modal-box .btn-submit-modal.hidden { display: none; }
        .modal-box .fail-actions { display: none; justify-content: center; margin-top: 16px; gap: 12px; }
        .modal-box .fail-actions.active { display: flex; }

        /* 确认/进度弹窗（删除用） */
        .confirm-box .confirm-actions { display: flex; gap: 12px; margin-top: 20px; justify-content: center; }
        .confirm-box .confirm-actions .btn { padding: 10px 30px; font-size: 15px; }
        .confirm-box .confirm-actions.hidden { display: none; }
        .confirm-box .confirm-message { font-size: 16px; text-align: center; padding: 10px 0; }
        .confirm-box .confirm-progress { margin-top: 16px; height: 4px; background: #e8ecf2; border-radius: 2px; overflow: hidden; display: none; }
        .confirm-box .confirm-progress.active { display: block; }
        .confirm-box .confirm-progress .bar { height: 100%; width: 0%; background: #2b6ef0; border-radius: 2px; animation: progressAnim 1.8s ease-in-out infinite; }
        .confirm-box .confirm-progress .bar.error { animation: none; background: #cf222e; width: 100%; }
        .confirm-box .confirm-status { display: none; text-align: center; font-size: 13px; color: #6b7a8f; margin-top: 8px; }
        .confirm-box .confirm-status.active { display: block; }
        .confirm-box .confirm-status.error { color: #cf222e; }
        .confirm-box .confirm-status.success { color: #1f883d; }
        .confirm-box .fail-actions { display: none; justify-content: center; margin-top: 16px; gap: 12px; }
        .confirm-box .fail-actions.active { display: flex; }

        /* 版本选择模态框（新增） */
        .version-box .version-actions { display: flex; gap: 12px; margin-top: 20px; justify-content: center; }
        .version-box .version-actions .btn { padding: 10px 30px; font-size: 15px; min-width: 100px; }
        .version-box .version-message { font-size: 16px; text-align: center; padding: 10px 0; color: #1a2332; }

        .avatar-zone { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: #f8fafc; border: 1px dashed #d0d6de; border-radius: 12px; padding: 8px 12px; }
        .avatar-zone .file-btn { padding: 4px 14px; background: #eef2f7; border-radius: 6px; cursor: pointer; font-size: 13px; border: 1px solid #dce0e6; }
        .avatar-zone .upload-btn { padding: 4px 18px; background: #eef2f7; border-radius: 6px; cursor: pointer; font-size: 13px; border: none; }
        .avatar-zone .status { font-size: 12px; color: #6b7a8f; }
        .avatar-preview { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .avatar-preview img { width: 50px; height: 66px; border-radius: 7px; object-fit: cover; border: 2px solid #e1e4e8; display: none; }
        .avatar-preview input { flex: 1; min-width: 140px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 头部 -->
    <div class="header-title">📋 数据管理</div>
    <div class="header-actions">
        <button class="btn btn-success btn-left" onclick="window.history.back()">🔙 返回</button>
        <button class="btn btn-outline btn-right" id="refreshBtn">🔄 刷新</button>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 搜索姓名...">
        <span class="badge" id="countDisplay">共 0 条</span>
    </div>
    <div class="table-wrap" id="tableWrap">
        <table>
            <thead>
                <tr>
                    <th style="width:30px;"><input type="checkbox" id="selectAll"></th>
                    <th style="width:60px;">头像</th>
                    <th style="min-width:80px;">姓名</th>
                    <th>身份证号</th>
                    <th style="min-width:120px;">操作</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="noData" class="no-data" style="display:none;">暂无数据</div>
    </div>
    <div class="batch-bar" id="batchBar">
        <span>已选 <span id="selectedCount">0</span> 项</span>
        <button class="btn btn-danger" id="batchDeleteBtn">🗑️ 批量删除</button>
    </div>
</div>

<!-- Toast 居中 -->
<div class="toast-center" id="toastCenter">
    <div class="toast-box">
        <div class="icon" id="toastIcon">✅</div>
        <div class="msg" id="toastMsg">加载成功</div>
        <div class="sub" id="toastSub">共 10 条</div>
        <button class="btn-close-toast" id="toastCloseBtn">知道了</button>
    </div>
</div>

<!-- 加载动画 -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">加载中...</div>
</div>

<!-- 编辑模态框 -->
<div class="modal-overlay" id="editModalOverlay">
    <div class="modal-box">
        <button class="close-btn" id="editModalCloseBtn">&times;</button>
        <h2 id="editModalTitle">编辑数据</h2>
        <form id="editForm">
            <input type="hidden" id="editIssueNumber" value="">
            <div class="field"><label>标题</label><input type="text" id="f_title" value="广东省食品从业人员健康证明"></div>
            <div class="field"><label>姓名 *</label><input type="text" id="f_name" placeholder="请输入姓名"></div>
            <div class="field"><label>性别</label><select id="f_gender"><option value="男">男</option><option value="女">女</option></select></div>
            <div class="field"><label>身份证号 *</label><input type="text" id="f_idNumber" placeholder="请输入身份证号码"></div>
            <div class="field"><label>体检单位</label><input type="text" id="f_hospital" value="广州东仁医院"></div>
            <div class="field"><label>体检日期</label><input type="date" id="f_date"></div>
            <div class="field"><label>一段（中间第一行）</label><input type="text" id="f_duan1" value="广东省食品从业人员"></div>
            <div class="field"><label>二段（中间第二行）</label><input type="text" id="f_duan2" value="健康证明"></div>
            <div class="field"><label>A版防伪字段</label><input type="text" id="f_afangwei" value="防伪标识二维码"></div>
            <div class="field"><label>B版健康信息</label><input type="text" id="f_bhealth" value="此健康信息已上报平台"></div>
            <div class="field"><label>A版第三卡片</label><select id="f_aCard3"><option value="0">显示</option><option value="1">隐藏</option></select></div>
            <div class="field"><label>B版第三卡片</label><select id="f_bCard3"><option value="0">显示</option><option value="1">隐藏</option></select></div>
            <div class="field">
                <label>头像照片</label>
                <div class="avatar-zone">
                    <span class="file-btn" id="editFileBtn">选择文件</span>
                    <input type="file" id="editAvatarFile" accept="image/*" style="display:none;">
                    <span id="editFileName">未选择</span>
                    <button type="button" class="upload-btn" id="editUploadBtn">上传</button>
                    <span class="status" id="editUploadStatus"></span>
                </div>
                <div class="avatar-preview">
                    <img id="editAvatarPreview" alt="预览">
                    <input type="url" id="f_avatar" placeholder="或手动粘贴图片链接">
                </div>
            </div>
            <div class="modal-progress" id="editProgress"><div class="bar"></div></div>
            <div class="modal-status" id="editStatus">⏳ 正在提交并等待部署...</div>
            <button type="submit" class="btn-submit-modal" id="editSubmitBtn">更新</button>
            <div class="fail-actions" id="editFailActions">
                <button class="btn-close-fail" id="editFailCloseBtn">关闭</button>
            </div>
        </form>
    </div>
</div>

<!-- 确认/进度弹窗（删除用） -->
<div class="modal-overlay" id="confirmModalOverlay">
    <div class="modal-box confirm-box">
        <h2 id="confirmTitle">确认操作</h2>
        <div class="confirm-message" id="confirmMessage">确定要执行此操作吗？</div>
        <div class="confirm-actions" id="confirmActions">
            <button class="btn btn-outline" id="confirmCancelBtn">取消</button>
            <button class="btn btn-danger" id="confirmOkBtn">确定</button>
        </div>
        <div class="confirm-progress" id="confirmProgress"><div class="bar"></div></div>
        <div class="confirm-status" id="confirmStatus">⏳ 正在处理并等待部署...</div>
        <div class="fail-actions" id="confirmFailActions">
            <button class="btn-close-fail" id="confirmFailCloseBtn">关闭</button>
        </div>
    </div>
</div>

<!-- ===== 新增：版本选择弹窗 ===== -->
<div class="modal-overlay" id="versionModalOverlay">
    <div class="modal-box version-box">
        <button class="close-btn" id="versionModalCloseBtn">&times;</button>
        <h2 id="versionModalTitle">选择版本</h2>
        <div class="version-message" id="versionMessage">请选择要查看的健康证版本</div>
        <div class="version-actions">
            <button class="btn btn-primary" id="versionBtnA">📄 A版</button>
            <button class="btn btn-info" id="versionBtnB">📄 B版</button>
        </div>
    </div>
</div>

<script>
(function() {
    var REPO_KEY = 'github_issue_upload_repo';
    var TOKEN_KEY = 'github_issue_upload_token';
    var IMGBB_KEY = 'github_issue_upload_imgbb';

    function getRepo() { return localStorage.getItem(REPO_KEY) || ''; }
    function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
    function getImgbbKey() { return localStorage.getItem(IMGBB_KEY) || ''; }

    var tbody = document.getElementById('tableBody');
    var noData = document.getElementById('noData');
    var searchInput = document.getElementById('searchInput');
    var countDisplay = document.getElementById('countDisplay');
    var selectAll = document.getElementById('selectAll');
    var selectedCount = document.getElementById('selectedCount');
    var batchDeleteBtn = document.getElementById('batchDeleteBtn');
    var refreshBtn = document.getElementById('refreshBtn');
    var loadingOverlay = document.getElementById('loadingOverlay');
    var loadingText = document.getElementById('loadingText');

    var toastCenter = document.getElementById('toastCenter');
    var toastIcon = document.getElementById('toastIcon');
    var toastMsg = document.getElementById('toastMsg');
    var toastSub = document.getElementById('toastSub');
    var toastCloseBtn = document.getElementById('toastCloseBtn');

    var editModalOverlay = document.getElementById('editModalOverlay');
    var editModalCloseBtn = document.getElementById('editModalCloseBtn');
    var editModalTitle = document.getElementById('editModalTitle');
    var editForm = document.getElementById('editForm');
    var editIssueNumber = document.getElementById('editIssueNumber');
    var editSubmitBtn = document.getElementById('editSubmitBtn');
    var editProgress = document.getElementById('editProgress');
    var editStatus = document.getElementById('editStatus');
    var editFailActions = document.getElementById('editFailActions');
    var editFailCloseBtn = document.getElementById('editFailCloseBtn');

    var confirmModalOverlay = document.getElementById('confirmModalOverlay');
    var confirmTitle = document.getElementById('confirmTitle');
    var confirmMessage = document.getElementById('confirmMessage');
    var confirmActions = document.getElementById('confirmActions');
    var confirmCancelBtn = document.getElementById('confirmCancelBtn');
    var confirmOkBtn = document.getElementById('confirmOkBtn');
    var confirmProgress = document.getElementById('confirmProgress');
    var confirmStatus = document.getElementById('confirmStatus');
    var confirmFailActions = document.getElementById('confirmFailActions');
    var confirmFailCloseBtn = document.getElementById('confirmFailCloseBtn');

    // 版本选择弹窗元素
    var versionModalOverlay = document.getElementById('versionModalOverlay');
    var versionModalCloseBtn = document.getElementById('versionModalCloseBtn');
    var versionBtnA = document.getElementById('versionBtnA');
    var versionBtnB = document.getElementById('versionBtnB');
    var versionMessage = document.getElementById('versionMessage');

    var f_title = document.getElementById('f_title');
    var f_name = document.getElementById('f_name');
    var f_gender = document.getElementById('f_gender');
    var f_idNumber = document.getElementById('f_idNumber');
    var f_hospital = document.getElementById('f_hospital');
    var f_date = document.getElementById('f_date');
    var f_duan1 = document.getElementById('f_duan1');
    var f_duan2 = document.getElementById('f_duan2');
    var f_afangwei = document.getElementById('f_afangwei');
    var f_bhealth = document.getElementById('f_bhealth');
    var f_aCard3 = document.getElementById('f_aCard3');
    var f_bCard3 = document.getElementById('f_bCard3');
    var f_avatar = document.getElementById('f_avatar');
    var editFileBtn = document.getElementById('editFileBtn');
    var editAvatarFile = document.getElementById('editAvatarFile');
    var editFileName = document.getElementById('editFileName');
    var editUploadBtn = document.getElementById('editUploadBtn');
    var editUploadStatus = document.getElementById('editUploadStatus');
    var editAvatarPreview = document.getElementById('editAvatarPreview');

    var allIssues = [], filteredIssues = [], selectedIds = new Set();
    var pollTimer = null;
    var MAX_POLLS = 24;
    var originalData = null;

    // 存储当前要查看的 issue 标题，供版本选择使用
    var pendingViewTitle = '';

    // ---- Toast 居中 ----
    function showToastCenter(icon, msg, sub) {
        toastIcon.textContent = icon || '✅';
        toastMsg.textContent = msg || '操作成功';
        toastSub.textContent = sub || '';
        toastCenter.classList.add('active');
    }
    function hideToastCenter() { toastCenter.classList.remove('active'); }
    toastCloseBtn.onclick = hideToastCenter;
    toastCenter.onclick = function(e) { if (e.target === this) hideToastCenter(); };

    function showLoading(msg) {
        loadingText.textContent = msg || '加载中...';
        loadingOverlay.classList.add('active');
    }
    function hideLoading() { loadingOverlay.classList.remove('active'); }

    // ---- 解析 Issue ----
    function parseIssue(issue) {
        var body = issue.body || '';
        var get = function(key) { var m = body.match(new RegExp(key + '[：:]\\s*(.+)')); return m ? m[1].trim() : ''; };
        var avatarMatch = body.match(/头像图片[：:]\s*(https?:\/\/[^\s]+)/);
        return {
            id: issue.id,
            number: issue.number,
            name: issue.title,
            idCard: get('身份证'),
            avatar: avatarMatch ? avatarMatch[1] : '',
            raw: {
                titleVal: get('标题') || '广东省食品从业人员健康证明',
                gender: get('性别') || '男',
                hospital: get('体检单位') || '广州东仁医院',
                date: get('体检日期') || '',
                duan1: get('一段') || '广东省食品从业人员',
                duan2: get('二段') || '健康证明',
                afangwei: get('A版防伪字段') || '防伪标识二维码',
                bhealth: get('B版健康信息') || '此健康信息已上报平台',
                aCard3: get('A版三卡显示') || '0',
                bCard3: get('B版三卡显示') || '0',
                avatar: avatarMatch ? avatarMatch[1] : ''
            }
        };
    }

    function escapeHtml(t) { if (!t) return ''; return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function updateSelectedCount() { selectedCount.textContent = selectedIds.size; }
    function updateSelectAllState() {
        var total = filteredIssues.length;
        if (total === 0) { selectAll.checked = false; selectAll.indeterminate = false; return; }
        var checked = 0;
        for (var i = 0; i < filteredIssues.length; i++) {
            if (selectedIds.has(filteredIssues[i].id)) checked++;
        }
        selectAll.checked = (checked === total);
        selectAll.indeterminate = (checked > 0 && checked < total);
    }

    function bindEvents() {
        var cbs = document.querySelectorAll('.row-cb');
        for (var i = 0; i < cbs.length; i++) {
            (function(cb) {
                cb.onchange = function() {
                    var id = parseInt(this.dataset.id);
                    if (this.checked) selectedIds.add(id);
                    else selectedIds.delete(id);
                    updateSelectedCount();
                    updateSelectAllState();
                };
            })(cbs[i]);
        }
        var editBtns = document.querySelectorAll('.edit-btn');
        for (var j = 0; j < editBtns.length; j++) {
            (function(btn) {
                btn.onclick = function() { openEditModal(parseInt(this.dataset.id)); };
            })(editBtns[j]);
        }
        var delBtns = document.querySelectorAll('.delete-btn');
        for (var k = 0; k < delBtns.length; k++) {
            (function(btn) {
                btn.onclick = function() { confirmDelete(parseInt(this.dataset.id)); };
            })(delBtns[k]);
        }
        var viewBtns = document.querySelectorAll('.view-btn');
        for (var l = 0; l < viewBtns.length; l++) {
            (function(btn) {
                btn.onclick = function() { showVersionSelect(parseInt(this.dataset.id)); };
            })(viewBtns[l]);
        }
    }

    // ---- 检测数据是否变化 ----

            idNumber: f_idNumber.value.trim(),

        };

            }
        }
        return false;
    }

    // ===== 核心：精准轮询单条卡片的 data-version =====
    function pollCardForIssue(issueNumber, oldVersion, onSuccess, onFail) {
        var count = 0;
        if (pollTimer) clearInterval(pollTimer);
        var cardUrl = 'https://merryAndrew.github.io/HealthCertificate/card.html?t=' + Date.now();

        function check() {
            count++;
            var msg = '⏳ 等待部署... (' + (count * 5) + '秒)';
            if (editStatus.classList.contains('active')) {
                editStatus.textContent = msg;
                editStatus.className = 'modal-status active';
            }
            if (confirmStatus.classList.contains('active')) {
                confirmStatus.textContent = msg;
                confirmStatus.className = 'confirm-status active';
            }

            fetch(cardUrl, { cache: 'no-store' })
                .then(function(res) {
                    if (!res.ok) throw new Error('网络错误');
                    return res.text();
                })
                .then(function(html) {
                    var regex = new RegExp('data-issue="' + issueNumber + '"\\s+data-version="([^"]+)"');
                    var match = html.match(regex);
                    if (match && match[1] !== oldVersion) {
                        clearInterval(pollTimer);
                        pollTimer = null;
                        if (onSuccess) onSuccess();
                        return;
                    }
                    if (count >= MAX_POLLS) {
                        clearInterval(pollTimer);
                        pollTimer = null;
                        if (onFail) onFail('部署超时（' + (MAX_POLLS * 5) + '秒），请检查 Actions 运行状态');
                    }
                })
                .catch(function(err) {
                    if (count >= MAX_POLLS) {
                        clearInterval(pollTimer);
                        pollTimer = null;
                        if (onFail) onFail('部署超时，网络可能异常，请手动刷新');
                    }
                });
        }

        check();
        pollTimer = setInterval(check, 5000);
    }

    // ---- 编辑提交 ----
    editForm.onsubmit = function(e) {
        e.preventDefault();

        if (!hasDataChanged()) {
            showToastCenter('ℹ️', '数据并无发生变化', '无需更新');
            editModalOverlay.classList.remove('active');
            originalData = null;
            return;
        }

        var repo = getRepo(), token = getToken();
        if (!repo || !token) { showToastCenter('⚠️', '请先配置仓库和 Token', ''); return; }
        var name = f_name.value.trim(), idNumber = f_idNumber.value.trim();
        if (!name || !idNumber) { showToastCenter('⚠️', '姓名和身份证号不能为空', ''); return; }
        var issueNumber = parseInt(editIssueNumber.value);
        if (!issueNumber) { showToastCenter('⚠️', '错误：未找到 Issue 编号', ''); return; }

        var oldVersion = '';
        for (var i = 0; i < allIssues.length; i++) {
            if (allIssues[i].number === issueNumber) {
                oldVersion = allIssues[i].updated_at;
                break;
            }
        }

        var body = '标题：' + f_title.value.trim() + '\n姓名：' + name + '\n性别：' + f_gender.value + '\n身份证：' + idNumber + '\n体检单位：' + f_hospital.value.trim() + '\n体检日期：' + f_date.value + '\n一段：' + f_duan1.value.trim() + '\n二段：' + f_duan2.value.trim() + '\nA版防伪字段：' + f_afangwei.value.trim() + '\nB版健康信息：' + f_bhealth.value.trim() + '\nA版三卡显示：' + f_aCard3.value + '\nB版三卡显示：' + f_bCard3.value + '\n';
        if (f_avatar.value.trim()) body += '头像图片：' + f_avatar.value.trim() + '\n';
        body += '提交于：' + new Date().toLocaleString('zh-CN');

        editProgress.classList.add('active');
        editStatus.textContent = '⏳ 正在提交更新...';
        editStatus.className = 'modal-status active';
        editSubmitBtn.disabled = true;
        editSubmitBtn.textContent = '更新中...';
        editSubmitBtn.classList.remove('hidden');
        editFailActions.classList.remove('active');

        var url = 'https://api.github.com/repos/' + repo + '/issues/' + issueNumber;
        fetch(url, {
            method: 'PATCH',
            headers: { Authorization: 'token ' + token, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: name, body: body })
        })
        .then(function(res) {
            if (!res.ok) throw new Error('更新失败 (' + res.status + ')');
            editStatus.textContent = '⏳ 已提交，等待部署...';

            pollCardForIssue(
                issueNumber,
                oldVersion,
                function() {
                    editModalOverlay.classList.remove('active');
                    editProgress.classList.remove('active');
                    editStatus.className = 'modal-status';
                    editSubmitBtn.disabled = false;
                    editSubmitBtn.textContent = '更新';
                    editSubmitBtn.classList.remove('hidden');
                    editFailActions.classList.remove('active');
                    showToastCenter('✅', '更新成功！', '卡片已更新');
                    originalData = null;
                    loadIssues();
                },
                function(errMsg) {
                    showEditFail(errMsg);
                }
            );
        })
        .catch(function(err) {
            showEditFail('提交失败：' + err.message);
            editSubmitBtn.disabled = false;
            editSubmitBtn.textContent = '更新';
        });
    };

    // ---- 执行单条删除 ----
    function doDelete(issue) {
        var repo = getRepo(), token = getToken();
        if (!repo || !token) { showToastCenter('⚠️', '请先配置仓库和 Token', ''); confirmModalOverlay.classList.remove('active'); return; }
        confirmActions.classList.add('hidden');
        confirmProgress.classList.add('active');
        confirmProgress.querySelector('.bar').className = 'bar';
        confirmStatus.textContent = '⏳ 正在删除并等待部署...';
        confirmStatus.className = 'confirm-status active';
        confirmFailActions.classList.remove('active');

        var url = 'https://api.github.com/repos/' + repo + '/issues/' + issue.number;
        fetch(url, {
            method: 'PATCH',
            headers: { Authorization: 'token ' + token, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ state: 'closed' })
        })
        .then(function(res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            confirmStatus.textContent = '⏳ 已提交删除，等待部署...';

            var oldVersion = issue.updated_at;
            pollCardForIssue(
                issue.number,
                oldVersion,
                function() {
                    confirmModalOverlay.classList.remove('active');
                    showToastCenter('✅', '删除成功！', '卡片已移除');
                    loadIssues();
                },
                function(errMsg) {
                    showConfirmFail(errMsg);
                }
            );
        })
        .catch(function(err) {
            showConfirmFail('删除失败：' + err.message);
        });
    }

    // ---- 执行批量删除 ----
    function doBatchDelete() {
        var repo = getRepo(), token = getToken();
        if (!repo || !token) { showToastCenter('⚠️', '请先配置仓库和 Token', ''); confirmModalOverlay.classList.remove('active'); return; }
        var ids = Array.from(selectedIds);
        var toDelete = [];
        for (var i = 0; i < allIssues.length; i++) {
            if (ids.indexOf(allIssues[i].id) !== -1) toDelete.push(allIssues[i]);
        }
        confirmActions.classList.add('hidden');
        confirmProgress.classList.add('active');
        confirmProgress.querySelector('.bar').className = 'bar';
        confirmStatus.textContent = '⏳ 正在批量删除 ' + toDelete.length + ' 条并等待部署...';
        confirmStatus.className = 'confirm-status active';
        confirmFailActions.classList.remove('active');

        var promises = [];
        for (var j = 0; j < toDelete.length; j++) {
            var url = 'https://api.github.com/repos/' + repo + '/issues/' + toDelete[j].number;
            promises.push(
                fetch(url, {
                    method: 'PATCH',
                    headers: { Authorization: 'token ' + token, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ state: 'closed' })
                })
            );
        }
        Promise.all(promises)
            .then(function() {
                confirmStatus.textContent = '⏳ 已提交删除，等待部署...';
                var firstIssue = toDelete[0];
                var oldVersion = firstIssue.updated_at;
                pollCardForIssue(
                    firstIssue.number,
                    oldVersion,
                    function() {
                        confirmModalOverlay.classList.remove('active');
                        showToastCenter('✅', '批量删除成功！', '已删除 ' + toDelete.length + ' 条');
                        loadIssues();
                    },
                    function(errMsg) {
                        showConfirmFail(errMsg);
                    }
                );
            })
            .catch(function(err) {
                showConfirmFail('批量删除失败：' + err.message);
            });
    }

                } else {

            })
            .catch(function(err) {
                editUploadStatus.textContent = '❌ ' + err.message;
                editUploadStatus.style.color = '#b33636';
            });
    };
    f_avatar.oninput = function() {
        if (this.value.trim()) { editAvatarPreview.src = this.value.trim(); editAvatarPreview.style.display = 'block'; }
        else { editAvatarPreview.style.display = 'none'; }
    };

    refreshBtn.onclick = loadIssues;

    var now = new Date();
    var year = now.getFullYear();
    var month = String(now.getMonth() + 1).padStart(2, '0');
    var day = String(now.getDate()).padStart(2, '0');
    var today = year + '-' + month + '-' + day;
    if (f_date) f_date.value = today;

    if (!getRepo() || !getToken()) {
        showToastCenter('⚠️', '请先配置仓库和 Token', '请在「系统配置」中保存');
    }
    loadIssues();
})();
</script>
</body>
</html>
